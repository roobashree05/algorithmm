services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: bugtracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bugtracker"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/bugtracker
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-local-dev-whatsapp-app-secret}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-local-dev-verify-token}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      GITLAB_PROVIDER: ${GITLAB_PROVIDER:-mock}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      GITLAB_ACCESS_TOKEN: ${GITLAB_ACCESS_TOKEN:-}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-local-dev-gitlab-webhook-secret}
      GITLAB_MOCK_STATE_PATH: /data/mock/gitlab.json
      ATTACHMENT_DIR: /data/attachments
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ENABLE_OUTBOX_WORKER: ${ENABLE_OUTBOX_WORKER:-true}
      DEFAULT_LABELS: ${DEFAULT_LABELS:-bug,whatsapp,customer-reported}
    volumes:
      - attachments:/data/attachments
      - mock_state:/data/mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  attachments:
  mock_state:
